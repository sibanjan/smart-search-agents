# The daemon, MCP server and agents read the SAME config file as SmartSearch:
#   1. $SMARTSEARCH_CONFIG   2. ./config.yaml   3. ~/.smartsearch/config.yaml
# Add these blocks to that file (SmartSearch ignores keys it doesn't know).

daemon:
  host: 127.0.0.1        # local only
  port: 8765             # web UI + API

schedule:                # cron; the watcher handles changes in between
  index: "0 2 * * *"           # nightly
  image_scan: "0 3 * * SUN"    # weekly (also re-links categories)

agents:
  backend: ollama              # ollama (local) | claude (excerpts leave the laptop)
  model: llama3.2              # Ollama model
  claude_model: claude-opus-5-5
  claude_effort: medium        # low | medium | high | xhigh | max
  max_rounds: 6                # tool-calling rounds per question
  context_chars: 6000          # per-tool-result budget for the local model
