<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmartSearch</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
    --accent: #2f5d50; --accent-soft: #e4eee9; --mark: #fbe7a1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --panel: #1e201d; --ink: #ecebe6; --muted: #9b9a93; --line: #2f322d;
            --accent: #8cc7b2; --accent-soft: #233029; --mark: #5a4a12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font: 600 28px/1.1 Georgia, "Iowan Old Style", serif; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  form { display: flex; gap: 8px; }
  input[type=search] { flex: 1; font: inherit; font-size: 17px; padding: 14px 16px; border-radius: 10px;
         border: 1px solid var(--line); background: var(--panel); color: var(--ink); outline: none; }
  input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           padding: 0 16px; border-radius: 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 20px; align-items: center; }
  .filters select, .filters input { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 8px;
         border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .result { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 14px 16px; margin-bottom: 10px; }
  .result .name { font-weight: 600; cursor: pointer; color: var(--accent); word-break: break-all; }
  .result .name:hover { text-decoration: underline; }
  .result .path { color: var(--muted); font-size: 12px; word-break: break-all; }
  .result .snip { margin-top: 6px; font-size: 14px; }
  .result mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; }
  .tag { background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 999px; }
  .tags .spacer { flex: 1; }
  .tags a { color: var(--muted); cursor: pointer; }
  .answer { background: var(--accent-soft); border-radius: 12px; padding: 16px; margin-bottom: 16px;
            white-space: pre-wrap; }
  .views { display: flex; gap: 16px; margin: -16px 0 20px; font-size: 14px; }
  .views a { color: var(--muted); cursor: pointer; padding-bottom: 2px; }
  .views a.on { color: var(--accent); border-bottom: 2px solid var(--accent); }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .cats button { font-size: 13px; padding: 4px 12px; border-radius: 999px; }
  .cats button.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tile img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; cursor: pointer; background: var(--line); }
  .tile .cap { padding: 6px 8px; font-size: 12px; }
  .tile .cap div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .cap .lbl { color: var(--muted); }
  .hidden { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px 18px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; font-weight: 600; line-height: 1.3; margin: 0 0 2px; }
  .card > p { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  details.card > summary { font-weight: 600; cursor: pointer; }
  details.card[open] > summary { margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field > label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .field .help { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .field .err { color: #b3261e; font-size: 12px; margin-top: 3px; }
  .field.check > label { display: flex; gap: 8px; align-items: center; font-weight: 400; }
  .card input:not([type=checkbox]), .card select, .card textarea { font: inherit; font-size: 14px; width: 100%;
         padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .card input[type=number] { width: 140px; }
  .card textarea { min-height: 76px; resize: vertical; }
  .card button { padding: 7px 14px; }
  .cat-row { display: grid; grid-template-columns: 150px 1fr auto; gap: 6px; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input { flex: 1; min-width: 200px; }
  .notice { border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px;
            background: var(--accent-soft); white-space: pre-line; }
  .notice.warn { background: var(--mark); }
  .savebar { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; display: flex; gap: 12px; align-items: center; }
  .savebar button { padding: 9px 22px; }
  .savebar span { color: var(--muted); font-size: 12px; word-break: break-all; }
  .status { position: fixed; bottom: 12px; right: 16px; font-size: 12px; color: var(--muted);
            max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 600px) { .cat-row { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { form { flex-wrap: wrap; } form button { padding: 10px 14px; } }
</style>
</head>
<body>
<main>
  <h1>SmartSearch</h1>
  <p class="sub">Ask in plain language — searches meaning, keywords and file names. <span id="privacy"></span></p>

  <nav class="views"><a id="vFiles" class="on">Files</a><a id="vImages">Images</a><a id="vSettings">Settings</a></nav>

  <section id="settingsView" class="hidden">
    <div id="notice"></div>
    <div id="settingsForm"></div>
    <div class="savebar"><button class="primary" id="saveBtn">Save changes</button><span id="cfgFile"></span></div>
  </section>

  <section id="imagesView" class="hidden">
    <div class="cats" id="cats"></div>
    <div class="meta" id="imgMeta"></div>
    <button id="scanBtn" class="hidden" style="padding:8px 16px;margin-bottom:12px">Scan images now</button>
    <div class="grid" id="grid"></div>
  </section>

  <section id="filesView">
  <form id="f">
    <input id="q" type="search" placeholder="e.g. invoice from the plumber last spring" autofocus autocomplete="off" />
    <button class="primary" type="submit">Search</button>
    <button type="button" id="askBtn" title="Answer with a local LLM (Ollama)">Ask AI</button>
  </form>

  <div class="filters">
    <select id="mode">
      <option value="hybrid">Hybrid</option>
      <option value="semantic">Semantic only</option>
      <option value="keyword">Keyword only</option>
    </select>
    <select id="ext">
      <option value="">All types</option>
      <option value=".pdf">PDF</option>
      <option value=".docx">Word</option>
      <option value=".xlsx">Excel</option>
      <option value=".pptx">PowerPoint</option>
      <option value=".md">Markdown</option>
      <option value=".txt">Text</option>
      <option value=".py">Python</option>
      <option value=".ipynb">Notebooks</option>
    </select>
    <select id="since">
      <option value="">Any time</option>
      <option value="1d">Past day</option>
      <option value="7d">Past week</option>
      <option value="30d">Past month</option>
      <option value="365d">Past year</option>
    </select>
    <input id="path" placeholder="path contains…" size="16" />
  </div>

  <div id="answer"></div>
  <div class="meta" id="meta"></div>
  <div id="results"></div>
  </section>
</main>
<div class="status" id="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function highlight(text, q) {
  let html = esc(text);
  const terms = q.toLowerCase().match(/\w{3,}/g) || [];
  for (const t of terms) {
    html = html.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"), "<mark>$1</mark>");
  }
  return html;
}

function params(q) {
  const p = new URLSearchParams({ q, mode: $("mode").value, limit: 25 });
  if ($("ext").value) p.append("ext", $("ext").value);
  if ($("since").value) p.set("since", $("since").value);
  if ($("path").value.trim()) p.set("path", $("path").value.trim());
  return p;
}

function render(results, q) {
  $("results").innerHTML = results.map((r) => {
    const dir = r.path.slice(0, r.path.length - r.name.length);
    const date = new Date(r.modified * 1000).toLocaleDateString();
    return `<div class="result">
      <div class="name" data-path="${esc(r.path)}">${esc(r.name)}</div>
      <div class="path">${esc(dir)}</div>
      <div class="snip">${highlight(r.snippet, q)}</div>
      <div class="tags">${r.matched_by.map((m) => `<span class="tag">${m}</span>`).join("")}
        <span class="spacer"></span><span>${date}</span>
        <a data-reveal="${esc(r.path)}">show in folder</a></div>
    </div>`;
  }).join("");
}

async function search(e) {
  e && e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("answer").innerHTML = "";
  const t0 = performance.now();
  const res = await fetch("/api/search?" + params(q));
  const data = await res.json();
  $("meta").textContent = `${data.results.length} results · ${Math.round(performance.now() - t0)} ms`;
  render(data.results, q);
}

async function ask() {
  const q = $("q").value.trim();
  if (!q) return;
  $("answer").innerHTML = `<div class="answer">Thinking…</div>`;
  const res = await fetch("/api/ask?" + new URLSearchParams({ q }));
  const data = await res.json();
  if (!res.ok) { $("answer").innerHTML = `<div class="answer">${esc(data.detail || "Error")}</div>`; return; }
  $("answer").innerHTML = `<div class="answer">${esc(data.answer)}</div>`;
  $("meta").textContent = "Sources";
  render(data.sources, q);
}

async function openFile(path, reveal) {
  await fetch("/api/open", { method: "POST", headers: { "Content-Type": "application/json" },
                             body: JSON.stringify({ path, reveal }) });
}

$("results").addEventListener("click", (e) => {
  const t = e.target;
  if (t.dataset.path) openFile(t.dataset.path, false);
  if (t.dataset.reveal) openFile(t.dataset.reveal, true);
});
$("f").addEventListener("submit", search);
$("askBtn").addEventListener("click", ask);
["mode", "ext", "since"].forEach((id) => $(id).addEventListener("change", () => $("q").value && search()));

let activeCat = null;
async function loadCategories() {
  const { categories, total } = await (await fetch("/api/images/categories")).json();
  const names = Object.keys(categories);
  if (!names.length) {
    $("cats").innerHTML = "";
    $("imgMeta").textContent = "No images yet. Scan your folders to find and group them.";
    $("grid").innerHTML = "";
    $("scanBtn").classList.remove("hidden");
    return;
  }
  $("scanBtn").classList.add("hidden");
  $("cats").innerHTML = [`<button data-cat="" class="${activeCat ? "" : "on"}">All ${total}</button>`]
    .concat(names.map((n) => `<button data-cat="${esc(n)}" class="${n === activeCat ? "on" : ""}">${esc(n)} ${categories[n]}</button>`))
    .join("");
  loadImages();
}

async function loadImages() {
  const p = new URLSearchParams({ limit: 200 });
  if (activeCat) p.set("category", activeCat);
  const { images } = await (await fetch("/api/images?" + p)).json();
  $("imgMeta").textContent = `${images.length} images${images.length === 200 ? " (showing the first 200)" : ""}`;
  $("grid").innerHTML = images.map((im) => {
    const lbl = im.labels.map((l) => l.source === "prompt" ? `${l.category} ${Math.round(l.score * 100)}%` : l.category)
      .join(" · ") || im.category;
    return `<div class="tile">
      <img loading="lazy" data-path="${esc(im.path)}" title="${esc(im.path)}"
           src="/api/images/thumb?${new URLSearchParams({ path: im.path })}" alt="${esc(im.name)}" />
      <div class="cap"><div>${esc(im.name)}</div><div class="lbl" title="${esc(im.folder)}">${esc(im.folder)}</div>
        <div class="lbl" title="${esc(lbl)}">${esc(lbl)}</div>
        <div><a data-reveal="${esc(im.path)}" style="color:var(--muted);cursor:pointer">show in folder</a></div></div>
    </div>`;
  }).join("");
}

function showView(view) {
  for (const [name, section, link] of [["files", "filesView", "vFiles"], ["images", "imagesView", "vImages"],
                                       ["settings", "settingsView", "vSettings"]]) {
    $(section).classList.toggle("hidden", view !== name);
    $(link).classList.toggle("on", view === name);
  }
  if (view === "images") loadCategories();
  if (view === "settings") loadSettings();
}
$("vFiles").addEventListener("click", () => showView("files"));
$("vImages").addEventListener("click", () => showView("images"));
$("vSettings").addEventListener("click", () => showView("settings"));
$("scanBtn").addEventListener("click", () => runJob("image_scan", "Image scan started."));
$("cats").addEventListener("click", (e) => {
  if (e.target.dataset.cat === undefined) return;
  activeCat = e.target.dataset.cat || null;
  loadCategories();
});
$("grid").addEventListener("click", (e) => {
  const t = e.target;
  if (t.dataset.path) openFile(t.dataset.path, false);
  if (t.dataset.reveal) openFile(t.dataset.reveal, true);
});

// ---- settings --------------------------------------------------------
const CRON = {
  index: [["Off", ""], ["Every day at 2 AM", "0 2 * * *"], ["Every 6 hours", "0 */6 * * *"], ["Every Sunday at 2 AM", "0 2 * * SUN"]],
  image_scan: [["Off", ""], ["Every Sunday at 3 AM", "0 3 * * SUN"], ["Every day at 3 AM", "0 3 * * *"]],
};
const LAYOUT = [
  { title: "Folders", note: "SmartSearch reads only these folders. Files stay where they are.", fields: [
    { k: "roots", label: "Folders to search", type: "lines", help: "One full path per line, e.g. C:\\Users\\you\\Documents" },
    { k: "image_roots", label: "Folders for images", type: "lines", help: "Leave empty to use the folders above." },
    { k: "skip_hidden", label: "Skip hidden files and folders", type: "bool" },
  ]},
  { title: "Files", fields: [
    { k: "extensions", label: "File types to index", type: "list", help: "Separate with commas." },
    { k: "max_file_size_mb", label: "Largest file to index (MB)", type: "number", step: "any" },
    { k: "image_min_size_kb", label: "Smallest image to include (KB)", type: "number", step: "any", help: "Skips icons and small thumbnails." },
  ]},
  { title: "Image categories", note: "Describe what the image shows, not why you have it.", custom: categoriesEditor },
  { title: "AI assistant", note: "Used by Ask. Search and images work without it.", fields: [
    { k: "agents.backend", label: "Run the assistant on", type: "select",
      options: [["This computer (Ollama)", "ollama"], ["Claude (cloud)", "claude"]] },
    { k: "agents.model", label: "Ollama model", type: "text", only: () => backend() === "ollama", help: "Needs Ollama installed, with this model pulled." },
    { k: "agents.claude_model", label: "Claude model", type: "text", only: () => backend() === "claude" },
    { k: "agents.claude_effort", label: "Claude effort", type: "select", only: () => backend() === "claude",
      options: ["low", "medium", "high", "xhigh", "max"].map((o) => [o, o]) },
  ], custom: claudeKeyEditor },
  { title: "Schedule", note: "Changed files are picked up as you save them. A scheduled run catches anything missed while SmartSearch was closed.", fields: [
    { k: "schedule.index", label: "Check all files", type: "cron", presets: CRON.index },
    { k: "schedule.image_scan", label: "Check all images", type: "cron", presets: CRON.image_scan },
  ]},
  { title: "Advanced", collapsed: true, fields: [
    { k: "exclude_dirs", label: "Folder names to skip", type: "list" },
    { k: "image_extensions", label: "Image types", type: "list" },
    { k: "default_limit", label: "Results per search", type: "number" },
    { k: "semantic_weight", label: "Weight: meaning", type: "number", step: "any" },
    { k: "keyword_weight", label: "Weight: keywords", type: "number", step: "any" },
    { k: "filename_weight", label: "Weight: file names", type: "number", step: "any" },
    { k: "chunk_size", label: "Chunk size (characters)", type: "number" },
    { k: "chunk_overlap", label: "Chunk overlap (characters)", type: "number" },
    { k: "image_min_confidence", label: "Lowest score for a main category (0-1)", type: "number", step: "any" },
    { k: "image_label_threshold", label: "Lowest score for an extra category (0-1)", type: "number", step: "any" },
    { k: "image_clusters", label: "Groups for unmatched images (0 = automatic)", type: "number" },
    { k: "image_min_cluster_size", label: "Smallest group of unmatched images", type: "number" },
    { k: "embedder", label: "Text embedder", type: "select", options: [["Automatic", "auto"], ["Sentence Transformers", "sentence-transformers"], ["Hash (no model, keyword-like)", "hash"]] },
    { k: "model_name", label: "Text model", type: "text", help: "Changing this clears the file index." },
    { k: "image_model", label: "Image model", type: "text", help: "Changing this clears the image index." },
    { k: "batch_size", label: "Embedding batch size", type: "number" },
    { k: "ollama_url", label: "Ollama address", type: "text" },
    { k: "agents.max_rounds", label: "Assistant: search rounds per question", type: "number" },
    { k: "agents.context_chars", label: "Assistant: characters per tool result (Ollama)", type: "number" },
    { k: "daemon.port", label: "Port", type: "number", help: "Takes effect after a restart." },
  ]},
];
const CLEARS_INDEX = { embedder: "file", model_name: "file", image_model: "image" };
let loaded = null, keySet = false;
const backend = () => { const el = document.querySelector('[data-key="agents.backend"]'); return el ? el.value : loaded.values["agents.backend"]; };

function fieldHtml(f) {
  const v = loaded.values[f.k], id = `data-key="${esc(f.k)}"`;
  const hide = f.only && !f.only() ? "hidden" : "";
  let input;
  if (f.type === "bool") {
    return `<div class="field check ${hide}" data-field="${esc(f.k)}"><label><input type="checkbox" ${id} ${v ? "checked" : ""}/>${esc(f.label)}</label><div class="err"></div></div>`;
  }
  if (f.type === "lines") input = `<textarea ${id}>${esc(v.join("\n"))}</textarea>`;
  else if (f.type === "list") input = `<textarea ${id}>${esc(v.join(", "))}</textarea>`;
  else if (f.type === "number") input = `<input type="number" step="${f.step || 1}" ${id} value="${esc(String(v))}"/>`;
  else if (f.type === "select") input = `<select ${id}>${f.options.map(([l, o]) => `<option value="${esc(o)}" ${o === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  else if (f.type === "cron") {
    const known = f.presets.some(([, o]) => o === v);
    input = `<select ${id}>${f.presets.map(([l, o]) => `<option value="${esc(o)}" ${o === v ? "selected" : ""}>${esc(l)}</option>`).join("")}
      <option value="custom" ${known ? "" : "selected"}>Custom (cron)</option></select>
      <input class="${known ? "hidden" : ""}" data-custom="${esc(f.k)}" style="margin-top:6px" placeholder="0 2 * * *" value="${known ? "" : esc(v)}"/>`;
  } else input = `<input ${id} value="${esc(String(v))}"/>`;
  return `<div class="field ${hide}" data-field="${esc(f.k)}"><label>${esc(f.label)}</label>${input}
    ${f.help ? `<div class="help">${esc(f.help)}</div>` : ""}<div class="err"></div></div>`;
}

function fieldValue(f) {
  const el = document.querySelector(`[data-key="${f.k}"]`);
  if (f.type === "bool") return el.checked;
  if (f.type === "lines") return el.value.split("\n").map((x) => x.trim()).filter(Boolean);
  if (f.type === "list") return el.value.split(",").map((x) => x.trim()).filter(Boolean);
  if (f.type === "number") return el.value === "" ? null : Number(el.value);
  if (f.type === "cron") return el.value === "custom" ? document.querySelector(`[data-custom="${f.k}"]`).value.trim() : el.value;
  return el.value;
}

function categoriesEditor() {
  const rows = Object.entries(loaded.values.image_categories).map(([n, p]) => catRow(n, p)).join("");
  return `<div class="field" data-field="image_categories"><div id="catRows">${rows}</div><div class="err"></div>
    <button type="button" id="addCat">Add category</button></div>`;
}
const catRow = (n, p) => `<div class="cat-row"><input placeholder="name" value="${esc(n)}"/>
  <input placeholder="a photo of..." value="${esc(p)}"/><button type="button" data-delcat="1">Remove</button></div>`;
const categoriesValue = () => Object.fromEntries([...document.querySelectorAll("#catRows .cat-row")]
  .map((r) => [r.children[0].value.trim(), r.children[1].value.trim()]).filter(([n, p]) => n || p));

function claudeKeyEditor() {
  return `<div id="claudeBox" class="${backend() === "claude" ? "" : "hidden"}">
    <div class="notice warn">With Claude on, the question and the file excerpts the assistant reads are sent to Anthropic. Everything else stays on this computer.</div>
    <div class="field"><label>Claude API key</label>
      <div class="row"><input type="password" id="claudeKey" autocomplete="off" placeholder="${keySet ? "A key is saved" : "sk-ant-..."}"/>
        <button type="button" id="saveKey">Save key</button>
        <button type="button" id="delKey" class="${keySet ? "" : "hidden"}">Remove</button></div>
      <div class="help">Kept in Windows Credential Manager, not in the config file.</div></div></div>`;
}

const maintenance = `<div class="card"><h2>Maintenance</h2><p>Runs in the background. Progress shows in the bottom corner.</p>
  <div class="row"><button type="button" data-job="index">Check files now</button>
  <button type="button" data-job="image_scan">Check images now</button>
  <button type="button" data-job="rebuild">Rebuild file index</button></div></div>`;

function renderSettings() {
  $("settingsForm").innerHTML = LAYOUT.map((sec) => {
    const body = (sec.fields || []).map(fieldHtml).join("") + (sec.custom ? sec.custom() : "");
    if (sec.collapsed) return `<details class="card"><summary>${esc(sec.title)}</summary>${body}</details>`;
    return `<div class="card"><h2>${esc(sec.title)}</h2>${sec.note ? `<p>${esc(sec.note)}</p>` : `<p></p>`}${body}</div>`;
  }).join("") + maintenance;
  $("cfgFile").textContent = "Saved to " + loaded.config_file;
}

async function loadSettings() {
  const data = await (await fetch("/api/settings")).json();
  loaded = data; keySet = data.claude_key_set;
  renderSettings();
  showRestart(data.restart_required);
  showPrivacy();
}

function showRestart(keys) {
  const box = document.getElementById("restartNote");
  if (box) box.remove();
  if (!keys.length) return;
  $("notice").insertAdjacentHTML("afterbegin", `<div class="notice warn" id="restartNote">Restart SmartSearch to finish applying: ${esc(keys.join(", "))}.</div>`);
}

function collectChanges() {
  const changes = {};
  for (const sec of LAYOUT) for (const f of sec.fields || []) {
    const v = fieldValue(f);
    if (JSON.stringify(v) !== JSON.stringify(loaded.values[f.k])) changes[f.k] = v;
  }
  const cats = categoriesValue();
  if (JSON.stringify(cats) !== JSON.stringify(loaded.values.image_categories)) changes.image_categories = cats;
  if (changes["agents.model"]) changes.ollama_model = changes["agents.model"]; // used by Ask until it moves to the agent
  return changes;
}

async function saveSettings() {
  document.querySelectorAll(".field .err").forEach((e) => (e.textContent = ""));
  const changes = collectChanges();
  if (!Object.keys(changes).length) { notify("Nothing to save."); return; }
  const clears = Object.keys(changes).filter((k) => CLEARS_INDEX[k]).map((k) => CLEARS_INDEX[k]);
  if (clears.length && !confirm(`This clears the ${[...new Set(clears)].join(" and ")} index after a restart. It is rebuilt from your files, which can take a while. Continue?`)) return;
  const res = await fetch("/api/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(changes) });
  const data = await res.json();
  if (!res.ok) {
    for (const [k, msg] of Object.entries(data.detail || {})) {
      const box = document.querySelector(`[data-field="${k}"] .err`);
      if (box) box.textContent = msg;
      const open = box && box.closest("details");
      if (open) open.open = true;
    }
    notify("Not saved. Fix the marked settings.", true);
    return;
  }
  await loadSettings();
  const lines = ["Saved."];
  if (data.jobs.length) lines.push("Started in the background: " + data.jobs.map((j) => JOB_NAMES[j.kind] || j.kind).join(", ") + ".");
  lines.push(...data.warnings);
  notify(lines.join("\n"), data.warnings.length > 0);
}

const JOB_NAMES = { index: "checking files", index_paths: "updating changed files", image_scan: "checking images",
                    image_classify: "sorting images", rebuild: "rebuilding the file index" };

function notify(text, warn) {
  const old = document.getElementById("saveNote");
  if (old) old.remove();
  $("notice").insertAdjacentHTML("beforeend", `<div class="notice ${warn ? "warn" : ""}" id="saveNote">${esc(text)}</div>`);
  $("notice").scrollIntoView({ behavior: "smooth", block: "center" });
}

async function runJob(kind, message) {
  const res = await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kind }) });
  if (res.ok) { status(); if (message) $("imgMeta").textContent = message; }
  return res.ok;
}

$("saveBtn").addEventListener("click", saveSettings);
$("settingsForm").addEventListener("change", (e) => {
  const key = e.target.dataset.key;
  if (key === "agents.backend") {
    for (const sec of LAYOUT) for (const f of sec.fields || []) {
      if (f.only) document.querySelector(`[data-field="${f.k}"]`).classList.toggle("hidden", !f.only());
    }
    $("claudeBox").classList.toggle("hidden", backend() !== "claude");
  }
  const custom = key && document.querySelector(`[data-custom="${key}"]`);
  if (custom) custom.classList.toggle("hidden", e.target.value !== "custom");
});
$("settingsForm").addEventListener("click", async (e) => {
  const t = e.target;
  if (t.id === "addCat") $("catRows").insertAdjacentHTML("beforeend", catRow("", ""));
  if (t.dataset.delcat) t.parentElement.remove();
  if (t.dataset.job) {
    if (t.dataset.job === "rebuild" && !confirm("Clear the file index and rebuild it from your files? Search is limited until it finishes.")) return;
    if (await runJob(t.dataset.job)) notify("Started in the background: " + JOB_NAMES[t.dataset.job] + ".");
  }
  if (t.id === "saveKey") {
    const res = await fetch("/api/settings/claude_key", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: $("claudeKey").value }) });
    if (res.ok) { keySet = true; $("claudeKey").value = ""; $("claudeKey").placeholder = "A key is saved"; $("delKey").classList.remove("hidden"); notify("Key saved."); }
    else notify("Enter a key first.", true);
  }
  if (t.id === "delKey") {
    await fetch("/api/settings/claude_key", { method: "DELETE" });
    keySet = false; $("claudeKey").placeholder = "sk-ant-..."; t.classList.add("hidden"); notify("Key removed.");
  }
});

async function showPrivacy() {
  try {
    const s = loaded || await (await fetch("/api/settings")).json();
    $("privacy").textContent = s.values["agents.backend"] === "claude"
      ? "Search stays on this computer. The assistant sends file excerpts to Anthropic."
      : "Everything stays on this computer.";
  } catch {}
}

async function status() {
  try {
    const s = await (await fetch("/api/daemon/status")).json();
    const job = s.running[0];
    const work = job ? `${JOB_NAMES[job.kind] || job.kind}${job.progress ? ": " + job.progress : ""}${s.queued ? ` (+${s.queued} waiting)` : ""} · ` : "";
    $("status").textContent = `${work}${s.index.files} files · ${s.images} images`;
  } catch {}
}
showPrivacy();
if (location.hash === "#settings") showView("settings");
status(); setInterval(status, 4000);
</script>
</body>
