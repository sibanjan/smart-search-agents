[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-search-agents"
version = "0.1.0"
description = "Daemon, MCP server and agents on top of SmartSearch (local AI file + image search)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sibanjan Das" }]
license = { text = "MIT" }
dependencies = [
    # core library: install from the sibling folder, e.g.  pip install -e ../smart-search[ai]
    "smartsearch",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "mcp>=1.2",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
ssa = "smart_search_agents.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B905", "E501"]
